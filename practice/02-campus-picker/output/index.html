<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Campus Break Picker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2b28;
      --muted: #596963;
      --paper: #fbfaf6;
      --surface: #fff;
      --line: #d8dfd9;
      --green: #17624c;
      --green-dark: #104936;
      --mint: #e4f2eb;
      --warm: #f4efe3;
      --focus: #bb6b22;
      --shadow: 0 16px 44px rgba(29, 43, 40, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px 36px;
      background:
        radial-gradient(ellipse at 90% 0%, rgba(211, 231, 216, .7), transparent 35rem),
        var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }
    .page { width: min(100%, 760px); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 7px; color: var(--green); font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.85rem, 7vw, 3rem); line-height: 1.1; letter-spacing: -.04em; }
    .subtitle { color: var(--muted); margin: 10px 0 0; max-width: 48ch; }
    .language {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 999px; padding: 9px 13px; font: inherit; font-weight: 700; cursor: pointer;
    }
    .notice {
      border: 1px solid #e6dcc6; background: var(--warm); color: #544931;
      border-radius: 12px; padding: 10px 13px; margin: 0 0 18px; font-size: .88rem;
    }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: clamp(18px, 5vw, 30px); }
    .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    label { display: block; margin: 0 0 7px; color: var(--muted); font-weight: 700; font-size: .88rem; }
    select {
      width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 11px;
      padding: 9px 34px 9px 12px; color: var(--ink); background: #fff; font: inherit;
    }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .primary, .secondary {
      min-height: 48px; border-radius: 11px; padding: 10px 17px; font: inherit;
      font-weight: 800; cursor: pointer;
    }
    .primary { flex: 1 1 220px; border: 0; background: var(--green); color: white; }
    .primary:hover { background: var(--green-dark); }
    .secondary { border: 1px solid var(--line); background: white; color: var(--ink); }
    .result {
      margin-top: 18px; min-height: 132px; border-radius: 16px; padding: 20px;
      border: 1px dashed #b7c9bd; background: #f5faf6;
    }
    .result.empty { display: grid; place-items: center; text-align: center; color: var(--muted); }
    .result-kicker { color: var(--green); font-size: .77rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .result h2 { margin: 5px 0 14px; font-size: clamp(1.35rem, 5vw, 1.8rem); line-height: 1.2; }
    .details { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
    .tag { border: 1px solid #d6e4da; background: white; color: #314d40; border-radius: 999px; padding: 5px 10px; font-size: .85rem; }
    .history { margin-top: 24px; }
    .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .history h2 { margin: 0; font-size: 1.12rem; }
    .clear { border: 0; background: transparent; padding: 7px 0 7px 8px; color: var(--green); font: inherit; font-weight: 750; cursor: pointer; }
    .history-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .history-item { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
    .history-id { flex: 0 0 auto; color: var(--green); font-weight: 850; font-variant-numeric: tabular-nums; }
    .history-name { flex: 1; font-weight: 650; }
    .history-minutes { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .history-empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; }
    footer { margin: 18px 2px 0; color: var(--muted); font-size: .78rem; text-align: center; }
    @media (max-width: 560px) {
      body { padding: 20px 13px 28px; }
      header { gap: 10px; }
      .filters { grid-template-columns: 1fr; gap: 12px; }
      .panel { border-radius: 16px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .primary { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <button class="language" id="language-toggle" type="button" aria-label="Switch language"></button>
    </header>

    <p class="notice">Fictional teaching activities; not an official university announcement.</p>

    <section class="panel" aria-label="Activity picker">
      <div class="filters">
        <div>
          <label for="location" id="location-label"></label>
          <select id="location">
            <option value="all" data-key="allLocations"></option>
            <option value="indoor" data-key="indoor"></option>
            <option value="outdoor" data-key="outdoor"></option>
          </select>
        </div>
        <div>
          <label for="minutes" id="minutes-label"></label>
          <select id="minutes">
            <option value="15">15</option>
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </div>
        <div>
          <label for="energy" id="energy-label"></label>
          <select id="energy">
            <option value="all" data-key="allEnergy"></option>
            <option value="low" data-key="low"></option>
            <option value="medium" data-key="medium"></option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="pick" type="button"></button>
        <button class="secondary" id="reset" type="button"></button>
      </div>
      <div class="result empty" id="result" role="status" aria-live="polite"></div>

      <section class="history" aria-labelledby="history-title">
        <div class="history-head">
          <h2 id="history-title"></h2>
          <button class="clear" id="clear-history" type="button"></button>
        </div>
        <ol class="history-list" id="history-list"></ol>
      </section>
    </section>

    <footer id="footer"></footer>
  </main>

  <script>
    "use strict";

    const activities = [
      { id: "A01", name_zh: "整理書包", name_en: "Organize your bag", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A02", name_zh: "畫一張小卡", name_en: "Draw a small card", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A03", name_zh: "寫三句讀書筆記", name_en: "Write three study notes", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A04", name_zh: "安靜讀兩頁書", name_en: "Read two pages quietly", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A05", name_zh: "排好明日待辦", name_en: "Plan tomorrow’s tasks", location_type: "indoor", minutes: 20, energy: "low" },
      { id: "A06", name_zh: "整理本機練習檔", name_en: "Organize practice files", location_type: "indoor", minutes: 30, energy: "medium" },
      { id: "A07", name_zh: "在合適位置慢走", name_en: "Take a gentle walk in a suitable area", location_type: "outdoor", minutes: 15, energy: "low" },
      { id: "A08", name_zh: "觀察天空並畫草圖", name_en: "Observe the sky and sketch", location_type: "outdoor", minutes: 20, energy: "low" },
      { id: "A09", name_zh: "在合適位置快走", name_en: "Take a brisk walk in a suitable area", location_type: "outdoor", minutes: 30, energy: "medium" },
      { id: "A10", name_zh: "規劃小組練習", name_en: "Plan a group exercise", location_type: "indoor", minutes: 45, energy: "medium" },
      { id: "A11", name_zh: "記錄自然色彩", name_en: "Record colors in nature", location_type: "outdoor", minutes: 45, energy: "low" },
      { id: "A12", name_zh: "構思下一次社團活動", name_en: "Brainstorm a future club activity", location_type: "indoor", minutes: 60, energy: "medium" }
    ];

    const copy = {
      en: {
        eyebrow: "A small pause between classes",
        title: "Campus Break Picker",
        subtitle: "Choose your setting, available time, and energy. Get one activity that fits all three.",
        languageButton: "中文",
        languageLabel: "Switch language to Chinese",
        locationLabel: "Location",
        allLocations: "All locations",
        indoor: "Indoor",
        outdoor: "Outdoor",
        minutesLabel: "Available time",
        energyLabel: "Energy",
        allEnergy: "All energy",
        low: "Low",
        medium: "Medium",
        pick: "Pick an activity",
        reset: "Reset filters",
        ready: "Your next break idea will appear here.",
        picked: "Your break idea",
        noMatch: "No matching activities.",
        activityId: "ID",
        activityName: "Name",
        activityMinutes: "Minutes",
        activityLocation: "Location type",
        activityEnergy: "Energy",
        historyTitle: "Recent picks",
        clearHistory: "Clear history",
        historyEmpty: "Successful picks from this page session will show here.",
        noHistory: "No picks yet.",
        footer: "History stays on this page until you close or reload it."
      },
      zh: {
        eyebrow: "課堂之間的小小休息",
        title: "校園休息活動挑選器",
        subtitle: "選擇地點、可用時間與活動能量，隨機挑選符合全部條件的活動。",
        languageButton: "English",
        languageLabel: "切換為英文介面",
        locationLabel: "地點",
        allLocations: "不限地點",
        indoor: "室內",
        outdoor: "室外",
        minutesLabel: "可用時間",
        energyLabel: "活動能量",
        allEnergy: "不限能量",
        low: "低",
        medium: "中",
        pick: "隨機挑選活動",
        reset: "重設篩選",
        ready: "符合條件的活動會顯示在這裡。",
        picked: "本次休息提案",
        noMatch: "沒有符合的活動。 / No matching activities.",
        activityId: "編號",
        activityName: "名稱",
        activityMinutes: "分鐘",
        activityLocation: "地點類型",
        activityEnergy: "活動能量",
        historyTitle: "最近挑選",
        clearHistory: "清除紀錄",
        historyEmpty: "本頁工作階段成功挑選的活動會顯示在這裡。",
        noHistory: "尚無挑選紀錄。",
        footer: "紀錄只保存在此頁面，關閉或重新載入後會清除。"
      }
    };

    const locationSelect = document.getElementById("location");
    const minutesSelect = document.getElementById("minutes");
    const energySelect = document.getElementById("energy");
    const result = document.getElementById("result");
    const historyList = document.getElementById("history-list");
    let language = "en";
    let latestPick = null;
    let history = [];

    function text(node, value) {
      node.textContent = value;
    }

    function makeTag(label, value) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = label + ": " + value;
      return tag;
    }

    function renderResult() {
      result.replaceChildren();
      result.classList.remove("empty");

      if (!latestPick) {
        result.classList.add("empty");
        text(result, copy[language].ready);
        return;
      }
      if (latestPick.noMatch) {
        result.classList.add("empty");
        text(result, copy[language].noMatch);
        return;
      }

      const t = copy[language];
      const activity = latestPick.activity;
      const kicker = document.createElement("div");
      kicker.className = "result-kicker";
      kicker.textContent = t.picked;
      const name = document.createElement("h2");
      name.textContent = activity[language === "zh" ? "name_zh" : "name_en"];
      const details = document.createElement("p");
      details.className = "details";
      details.append(
        makeTag(t.activityId, activity.id),
        makeTag(t.activityMinutes, String(activity.minutes)),
        makeTag(t.activityLocation, t[activity.location_type]),
        makeTag(t.activityEnergy, t[activity.energy])
      );
      result.append(kicker, name, details);
    }

    function renderHistory() {
      historyList.replaceChildren();
      if (history.length === 0) {
        const empty = document.createElement("li");
        empty.className = "history-empty";
        empty.textContent = copy[language].historyEmpty;
        historyList.append(empty);
        return;
      }
      for (const activity of history) {
        const item = document.createElement("li");
        item.className = "history-item";
        const id = document.createElement("span");
        id.className = "history-id";
        id.textContent = activity.id;
        const name = document.createElement("span");
        name.className = "history-name";
        name.textContent = activity[language === "zh" ? "name_zh" : "name_en"];
        const minutes = document.createElement("span");
        minutes.className = "history-minutes";
        minutes.textContent = activity.minutes + " " + copy[language].activityMinutes;
        item.append(id, name, minutes);
        historyList.append(item);
      }
    }

    function renderInterface() {
      const t = copy[language];
      document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
      text(document.getElementById("eyebrow"), t.eyebrow);
      text(document.getElementById("title"), t.title);
      text(document.getElementById("subtitle"), t.subtitle);
      const toggle = document.getElementById("language-toggle");
      text(toggle, t.languageButton);
      toggle.setAttribute("aria-label", t.languageLabel);
      text(document.getElementById("location-label"), t.locationLabel);
      text(document.getElementById("minutes-label"), t.minutesLabel);
      text(document.getElementById("energy-label"), t.energyLabel);
      for (const option of document.querySelectorAll("option[data-key]")) {
        text(option, t[option.dataset.key]);
      }
      text(document.getElementById("pick"), t.pick);
      text(document.getElementById("reset"), t.reset);
      text(document.getElementById("history-title"), t.historyTitle);
      text(document.getElementById("clear-history"), t.clearHistory);
      text(document.getElementById("footer"), t.footer);
      renderResult();
      renderHistory();
    }

    document.getElementById("pick").addEventListener("click", function () {
      const location = locationSelect.value;
      const timeLimit = Number(minutesSelect.value);
      const energy = energySelect.value;
      const matches = activities.filter(function (activity) {
        return (location === "all" || activity.location_type === location) &&
          activity.minutes <= timeLimit &&
          (energy === "all" || activity.energy === energy);
      });
      if (matches.length === 0) {
        latestPick = { noMatch: true };
        renderResult();
        return;
      }
      const chosen = matches[Math.floor(Math.random() * matches.length)];
      latestPick = { activity: chosen };
      history.unshift(chosen);
      history = history.slice(0, 5);
      renderResult();
      renderHistory();
    });

    document.getElementById("clear-history").addEventListener("click", function () {
      history = [];
      renderHistory();
    });

    document.getElementById("reset").addEventListener("click", function () {
      locationSelect.value = "all";
      minutesSelect.value = "30";
      energySelect.value = "all";
    });

    document.getElementById("language-toggle").addEventListener("click", function () {
      language = language === "en" ? "zh" : "en";
      renderInterface();
    });

    renderInterface();
  </script>
</body>
</html>
